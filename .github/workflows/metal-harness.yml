name: Metal harness validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Retain the parent register so a committed defect deletion is checked.
          fetch-depth: 2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install numerical test dependency
        run: python3 -m pip install -r tools/metal/requirements.txt
      - name: Validate source-independent harness
        run: |
          set -euo pipefail
          python3 tools/metal/validate_harness.py
          python3 -m unittest discover -s tools/metal/tests -v
          python3 -m py_compile tools/metal/*.py
          bash -n tools/metal/*.sh
          git diff --check
      - name: Check GL audit tooling only (not a release gate)
        run: python3 tools/metal/audit_gl.py --mode inventory --output "$RUNNER_TEMP/metal-gl-inventory.json"
