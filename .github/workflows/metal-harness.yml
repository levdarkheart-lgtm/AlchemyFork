name: Metal harness validation
on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - '.agents/**'
      - 'docs/metal/**'
      - 'tools/metal/**'
      - '.github/workflows/metal-harness.yml'
  push:
    paths:
      - 'AGENTS.md'
      - '.agents/**'
      - 'docs/metal/**'
      - 'tools/metal/**'
      - '.github/workflows/metal-harness.yml'
permissions:
  contents: read
jobs:
  validate-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate source-independent harness
        run: |
          set -euo pipefail
          python3 tools/metal/validate_harness.py
          python3 -m unittest discover -s tools/metal/tests -v
          python3 -m py_compile tools/metal/*.py
          bash -n tools/metal/*.sh
          git diff --check
      - name: Check GL audit tooling only (not a release gate)
        run: python3 tools/metal/audit_gl.py --mode inventory --output "$RUNNER_TEMP/metal-gl-inventory.json"
