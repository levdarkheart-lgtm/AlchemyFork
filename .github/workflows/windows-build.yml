```yaml
name: Windows build

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 180

    env:
      AUTOBUILD_WIN_CMAKE_GEN: Visual Studio 17 2022
      AUTOBUILD_WIN_VSPLATFORM: x64
      AUTOBUILD_VSVER: "170"
      AUTOBUILD_ADDRSIZE: "64"
      AUTOBUILD_CPU_COUNT: "4"
      AUTOBUILD_PLATFORM: "windows64"
      LL_BUILD_RELEASE: "1"
      LL_BUILD_RELWITHDEBINFO: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUTF8: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v4

      - name: Install Python build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install cmake ninja certifi llbase llsd autobuild

      - name: Show tool versions
        shell: pwsh
        run: |
          python --version
          pip --version
          cmake --version
          ninja --version
          autobuild --version

      - name: Remove private installables from autobuild.xml
        shell: pwsh
        run: |
          @'
          import xml.etree.ElementTree as ET

          path = "autobuild.xml"
          tree = ET.parse(path)
          root = tree.getroot()

          private_keys = {
              "fmodstudio",
              "kdu",
              "havok-source",
              "llphysicsextensions_source",
              "discord_sdk",
          }

          def find_installables_map(root_elem):
              children = list(root_elem)
              for i in range(len(children) - 1):
                  if children[i].tag == "key" and children[i].text == "installables":
                      return children[i + 1]
              raise RuntimeError("installables map not found")

          installables = find_installables_map(root)
          items = list(installables)

          new_children = []
          removed = []

          i = 0
          while i < len(items):
              node = items[i]
              if node.tag == "key" and i + 1 < len(items):
                  key_name = node.text
                  value_node = items[i + 1]
                  if key_name in private_keys:
                      removed.append(key_name)
                  else:
                      new_children.append(node)
                      new_children.append(value_node)
                  i += 2
              else:
                  new_children.append(node)
                  i += 1

          installables.clear()
          for child in new_children:
              installables.append(child)

          tree.write(path, encoding="utf-8", xml_declaration=True)
          print("Removed installables:", ", ".join(removed) if removed else "none")
          '@ | python

      - name: Configure
        shell: pwsh
        run: |
          autobuild configure -c ReleaseOS -A64 -- -DLL_TESTS=OFF -DPACKAGE=ON -DUSE_FMODSTUDIO:BOOL=OFF -DUSE_BUGSPLAT:BOOL=OFF -DUSE_DISCORD:BOOL=OFF -DDISABLE_FATAL_WARNINGS:BOOL=ON

      - name: Build
        shell: pwsh
        run: |
          autobuild build -c ReleaseOS -A64 --no-configure

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null

          $candidates = @(
            'build-vc170-64/newview/Release',
            'build-vc170-64/newview/RelWithDebInfo',
            'build-vc170-64/newview/packaged',
            'build-vc170-64/newview'
          )

          foreach ($path in $candidates) {
            if (Test-Path $path) {
              Write-Host "Copying from $path"
              Copy-Item -Path $path -Destination artifacts -Recurse -Force -ErrorAction SilentlyContinue
            }
          }

          Get-ChildItem -Path artifacts -Recurse | Select-Object FullName

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: alchemy-windows-build
          path: artifacts
          if-no-files-found: error
          retention-days: 14
```
