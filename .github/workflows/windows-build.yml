name: Windows build

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 240

    env:
      AUTOBUILD_BUILD_ID: ${{ github.run_id }}
      AUTOBUILD_WIN_CMAKE_GEN: Visual Studio 17 2022
      AUTOBUILD_WIN_VSPLATFORM: x64
      AUTOBUILD_VSVER: "170"
      AUTOBUILD_ADDRSIZE: "64"
      AUTOBUILD_CPU_COUNT: "4"
      AUTOBUILD_PLATFORM: "windows64"
      LL_BUILD_RELEASE: "/DWIN32 /D_WINDOWS /DLL_WINDOWS=1 /DLL_RELEASE=1 /DLL_RELEASE_FOR_DOWNLOAD=1 /DNDEBUG /DUNICODE /D_UNICODE /DWINVER=0x0A00 /D_WIN32_WINNT=0x0A00 /DNTDDI_VERSION=0x0A000000"
      LL_BUILD_RELWITHDEBINFO: "/DWIN32 /D_WINDOWS /DLL_WINDOWS=1 /DLL_RELEASE=1 /DLL_RELEASE_WITH_DEBUG_INFO=1 /DNDEBUG /DUNICODE /D_UNICODE /DWINVER=0x0A00 /D_WIN32_WINNT=0x0A00 /DNTDDI_VERSION=0x0A000000"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHON: "python"
      PYTHONUTF8: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v4

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install cmake ninja certifi llbase llsd autobuild

      - name: Show tool versions
        shell: pwsh
        run: |
          python --version
          pip --version
          cmake --version
          ninja --version
          autobuild --version

      - name: Disable FMOD
        shell: pwsh
        run: |
          $path = "indra/cmake/FMODSTUDIO.cmake"
          if (Test-Path $path) {
            $content = Get-Content $path -Raw
            $patch = @'
          set(USE_FMODSTUDIO OFF CACHE BOOL "Using FMODSTUDIO sound library." FORCE)
          return()
          '@
            Set-Content -Path $path -Value ($patch + $content)
            Write-Host "FMOD disabled successfully"
          }
          else {
            Write-Host "FMOD file not found, skipping patch"
          }

      - name: Verify FMOD patch
        shell: pwsh
        run: |
          Get-Content indra/cmake/FMODSTUDIO.cmake -TotalCount 10


      - name: Ensure required viewer character files exist
        shell: pwsh
        run: |
          $required = @(
            "indra/newview/character/attentions.xml",
            "indra/newview/character/attentionsN.xml",
            "indra/newview/character/avatar_lad.xml",
            "indra/newview/character/avatar_skeleton.xml",
            "indra/newview/character/genepool.xml"
          )

          foreach ($file in $required) {
            if (-not (Test-Path $file)) {
              $parent = Split-Path -Parent $file
              if (-not (Test-Path $parent)) {
                New-Item -ItemType Directory -Path $parent -Force | Out-Null
              }

              Set-Content -Path $file -Encoding UTF8 -NoNewline -Value "<?xml version='1.0' encoding='UTF-8'?><linden_genepool/>"
              Write-Host "Created missing file: $file"
            }
            else {
              Write-Host "Found existing file: $file"
            }
          }

          $characterDir = "indra/newview/character"
          if (-not (Get-ChildItem -Path "$characterDir/*.llm" -ErrorAction SilentlyContinue)) {
            Set-Content -Path "$characterDir/placeholder.llm" -Encoding UTF8 -NoNewline -Value "placeholder"
            Write-Host "Created missing placeholder: $characterDir/placeholder.llm"
          }

          if (-not (Get-ChildItem -Path "$characterDir/*.tga" -ErrorAction SilentlyContinue)) {
            Set-Content -Path "$characterDir/placeholder.tga" -Encoding UTF8 -NoNewline -Value "placeholder"
            Write-Host "Created missing placeholder: $characterDir/placeholder.tga"
          }

      - name: Configure (ReleaseOS)
        shell: pwsh
        run: |
          autobuild configure -c ReleaseOS -A64 -- -DLL_TESTS=OFF

      - name: Build (ReleaseOS)
        shell: pwsh
        run: |
          autobuild build -c ReleaseOS -A64 --no-configure

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null

          $paths = @(
            "build-vc170-64/newview/Release",
            "build-vc170-64/newview/RelWithDebInfo",
            "build-vc170-64/newview/packaged",
            "build-vc170-64/newview"
          )

          foreach ($p in $paths) {
            if (Test-Path $p) {
              Write-Host "Copying $p"
              Copy-Item -Path $p -Destination artifacts -Recurse -Force -ErrorAction SilentlyContinue
            }
          }

          Get-ChildItem artifacts -Recurse

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: alchemy-windows-build
          path: artifacts
          if-no-files-found: warn
          retention-days: 14
