[package]
name = "alchemy-aurora-eval"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
license = "GPL-3.0-or-later"
publish = false
build = "build.rs"

[workspace]

[lib]
test = false
bench = false

[[bin]]
name = "aurora-eval"
path = "src/main.rs"
test = false
bench = false

[dependencies]
bytemuck = { version = "=1.25.2", features = ["derive"] }
glam = { version = "=0.34.3", features = ["bytemuck"] }
half = { version = "=2.7.1", features = ["bytemuck"] }
pollster = "=1.0.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
anyhow = "=1.0.104"
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "metal", "wgsl", "counters"] }
naga = { version = "=30.0.1", features = ["wgsl-in"] }

[patch.crates-io]
naga = { git = "https://github.com/Aurora-Viewer/wgpu", rev = "6c13013b3f9c8a7e45154d45d120ada0cbe55a23" }
naga-types = { git = "https://github.com/Aurora-Viewer/wgpu", rev = "6c13013b3f9c8a7e45154d45d120ada0cbe55a23" }
wgpu = { git = "https://github.com/Aurora-Viewer/wgpu", rev = "6c13013b3f9c8a7e45154d45d120ada0cbe55a23" }
wgpu-core = { git = "https://github.com/Aurora-Viewer/wgpu", rev = "6c13013b3f9c8a7e45154d45d120ada0cbe55a23" }
wgpu-core-deps-apple = { git = "https://github.com/Aurora-Viewer/wgpu", rev = "6c13013b3f9c8a7e45154d45d120ada0cbe55a23" }
wgpu-core-deps-emscripten = { git = "https://github.com/Aurora-Viewer/wgpu", rev = "6c13013b3f9c8a7e45154d45d120ada0cbe55a23" }
wgpu-core-deps-wasm = { git = "https://github.com/Aurora-Viewer/wgpu", rev = "6c13013b3f9c8a7e45154d45d120ada0cbe55a23" }
wgpu-core-deps-windows-linux-android = { git = "https://github.com/Aurora-Viewer/wgpu", rev = "6c13013b3f9c8a7e45154d45d120ada0cbe55a23" }
wgpu-hal = { git = "https://github.com/Aurora-Viewer/wgpu", rev = "6c13013b3f9c8a7e45154d45d120ada0cbe55a23" }
wgpu-naga-bridge = { git = "https://github.com/Aurora-Viewer/wgpu", rev = "6c13013b3f9c8a7e45154d45d120ada0cbe55a23" }
wgpu-types = { git = "https://github.com/Aurora-Viewer/wgpu", rev = "6c13013b3f9c8a7e45154d45d120ada0cbe55a23" }
